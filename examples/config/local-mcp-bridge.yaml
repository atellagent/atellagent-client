# Example local MCP adapter configuration for Codex or another supported host.
#
# The adapter is credential-free and is not enrolled. `control_socket` must
# match the owner-private socket of the running Agent Proxy control service.
# The service fetches its assigned tool catalog from Atellagent; do not put
# target bindings, tool names, or provider credentials in this file.
control_socket: /run/user/<uid>/atellagent/control.sock
