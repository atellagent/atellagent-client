# Example only. Keep the Slack bot token and mTLS key in a secret store.
gateway_mtls_url: https://gateway.example.com
oauth_token_url: https://auth.example.com/oidc/token
oauth_jwks_url: https://auth.example.com/oidc/jwks
client_id: channel-service-account-xxxx
service_account_id: sa-uuid-from-backend
integration_id: integration-uuid-from-backend
tenant_id: tenant-uuid-from-backend
placement: connected
protocol_version: v1
packaging: bridge
integration_type: channel
integration_name: slack-channel-runtime
integration_category: slack
telemetry_url: https://gateway.example.com/v1/monitoring/integrations/ingest

timeout: 120
capabilities:
  - channel.ingress
  - channel.send_message

deployment:
  type: bridge
  target_transport: handler

channel:
  channel_type: slack
  provider_key: slack
  adapter_key: slack_events
  ingress_enabled: true
  egress_enabled: true
