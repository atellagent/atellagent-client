# Example Tool Proxy configuration for a customer-local MCP server.
#
# This is an enrolled, connected MCP runtime with its own service-account
# identity. It is not the credential-free local Codex MCP adapter. The
# dashboard-generated configuration supplies the real immutable IDs,
# certificate paths, and target-specific values.
gateway_mtls_url: https://gateway.example.com
oauth_token_url: https://auth.example.com/oidc/token
oauth_jwks_url: https://auth.example.com/oidc/jwks
client_id: mcp-service-account-xxxx
service_account_id: sa-uuid-from-backend
integration_id: integration-uuid-from-backend
tenant_id: tenant-uuid-from-backend
placement: connected
protocol_version: v1
packaging: bridge
integration_type: mcp
mcp_descriptor_path_template: /v1/connected-runtimes/instances/{instance_id}/descriptors/mcp
capabilities:
  - mcp.tools
deployment:
  type: bridge
  target_transport: stdio
  target_command: local-mcp-server
telemetry_url: https://gateway.example.com/v1/monitoring/integrations/ingest

timeout: 120
