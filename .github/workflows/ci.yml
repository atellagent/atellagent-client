name: CI (atellagent-client)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-boundary:
    runs-on: ubuntu-latest
    outputs:
      client_version: ${{ steps.release-metadata.outputs.client_version }}
      wheel_sha256: ${{ steps.release-metadata.outputs.wheel_sha256 }}
      build_date: ${{ steps.release-metadata.outputs.build_date }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify the clean source and import allowlists
        run: |
          python - <<'PY'
          import ast
          import sys
          from pathlib import Path

          root = Path.cwd()
          tree = ast.parse((root / "setup.py").read_text(encoding="utf-8"))

          def declared_tuple(name):
              return next(
                  ast.literal_eval(node.value)
                  for node in tree.body
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == name for target in node.targets)
              )

          repository_entries = set(declared_tuple("PUBLIC_REPOSITORY_ENTRIES"))
          actual_entries = {entry.name for entry in root.iterdir() if entry.name != ".git"}
          assert actual_entries == repository_entries, (
              f"public source root mismatch: missing={sorted(repository_entries - actual_entries)} "
              f"extra={sorted(actual_entries - repository_entries)}"
          )
          source_paths = set(declared_tuple("PUBLIC_SOURCE_PATHS"))
          actual_paths = {
              str(path.relative_to(root)) for path in root.rglob("*")
              if path.is_file() and ".git" not in path.relative_to(root).parts
          }
          assert actual_paths == source_paths, (
              f"public source files mismatch: missing={sorted(source_paths - actual_paths)} "
              f"extra={sorted(actual_paths - source_paths)}"
          )
          packages = set(declared_tuple("PUBLIC_PACKAGES"))
          actual_packages = {"atellagent_client"}
          for init_file in root.rglob("__init__.py"):
              relative = init_file.parent.relative_to(root)
              if str(relative) != ".":
                  actual_packages.add("atellagent_client." + ".".join(relative.parts))
          assert actual_packages == packages, "PUBLIC_PACKAGES must exactly match package directories"

          import_roots = {"atellagent_client", *declared_tuple("PUBLIC_THIRD_PARTY_IMPORT_ROOTS")}
          standard_library = set(sys.stdlib_module_names) | {"__future__"}
          unapproved = {}
          for source in root.rglob("*.py"):
              parsed = ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
              for node in ast.walk(parsed):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module]
                  else:
                      continue
                  for name in names:
                      import_root = name.split(".", 1)[0]
                      if import_root not in standard_library and import_root not in import_roots:
                          unapproved.setdefault(import_root, set()).add(str(source.relative_to(root)))
          assert not unapproved, f"public source imports unapproved dependencies: {unapproved}"
          PY

      - name: Install the locked public runtime and documented extras
        run: |
          python -m pip install --upgrade pip==24.0
          pip install --constraint requirements/constraints-py311.lock '.[test,mcp-agent-proxy,mcp-tool-proxy]'
          pip check

      - name: Reject direct provider-to-MCP coupling
        run: |
          ! rg -n 'MCPServer|HostedMCP|McpToolset|mcp_servers|streamable_http|claude_agent_sdk|openai_agents|google_adk' integrations/providers
          ! rg -n 'claude-agent-sdk|openai-agents|google-adk' setup.py requirements

      - name: Compile and test public Python sources
        run: |
          python -m compileall -q cli connected examples governance integrations pep protocol proxy sdk __init__.py _version.py
          python -m unittest discover -s tests -v

      - name: Build the release wheel and source distribution once
        run: |
          python -m pip install build==1.5.0
          python -m build --sdist --wheel

      - id: release-metadata
        name: Validate package release metadata and record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from _version import CLIENT_LIBRARY_VERSION; print(CLIENT_LIBRARY_VERSION)')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fqx "## $version" CHANGELOG.md
          wheel=$(find dist -maxdepth 1 -name 'atellagent_client-*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name 'atellagent_client-*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          python - "$wheel" "$version" <<'PY'
          import sys
          import zipfile
          wheel, version = sys.argv[1:]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))
              assert f"Version: {version}\n" in archive.read(metadata).decode('utf-8')
          PY
          echo "client_version=$version" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$(sha256sum "$wheel" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify positive source and artifact allowlists
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import ast, glob, tarfile, zipfile

          root = Path.cwd()
          tree = ast.parse((root / "setup.py").read_text(encoding="utf-8"))
          def declared_tuple(name):
              return next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == name for target in node.targets))
          packages = set(declared_tuple("PUBLIC_PACKAGES"))
          package_roots = {package.split(".", 1)[1].split(".", 1)[0] for package in packages if "." in package}
          source_paths = set(declared_tuple("PUBLIC_SOURCE_PATHS"))
          expected_package_files = {
              "atellagent_client/" + path for path in source_paths
              if path in {"__init__.py", "_version.py", "py.typed"} or (path.split("/", 1)[0] in package_roots and PurePosixPath(path).suffix in {".py", ".yaml", ".json", ".toml"})
          }
          wheel_path = Path(glob.glob("dist/*.whl")[0])
          with zipfile.ZipFile(wheel_path) as wheel:
              names = set(wheel.namelist())
          actual_package_files = {name for name in names if name.startswith("atellagent_client/")}
          assert actual_package_files == expected_package_files, "wheel package files are outside the positive allowlist"

          root_files = {"CHANGELOG.md", "COMPATIBILITY.md", "LICENSE.md", "MANIFEST.in", "PKG-INFO", "README.md", "SECURITY.md", "SUPPORT.md", "THIRD_PARTY_NOTICES.md", "__init__.py", "_version.py", "py.typed", "pyproject.toml", "setup.cfg", "setup.py"}
          sdist_roots = root_files | package_roots | {"docs", "requirements"}
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as sdist:
              names = [member.name for member in sdist.getmembers()]
          root_name = names[0].split("/", 1)[0]
          for name in names:
              relative = "" if name == root_name else name.removeprefix(root_name + "/")
              if relative and relative.split("/", 1)[0] not in sdist_roots:
                  raise AssertionError(f"sdist entry outside the positive allowlist: {relative}")
          PY

      - name: Smoke test the installed wheel outside the checkout
        run: |
          python -m venv /tmp/atellagent-client-wheel-test
          wheel_path=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          /tmp/atellagent-client-wheel-test/bin/pip install --constraint "$GITHUB_WORKSPACE/requirements/constraints-py311.lock" "${wheel_path}[test,mcp-agent-proxy,mcp-tool-proxy]"
          cd /tmp
          /tmp/atellagent-client-wheel-test/bin/python -c 'import atellagent_client; assert atellagent_client.__version__'
          /tmp/atellagent-client-wheel-test/bin/atellagent-cli --help >/dev/null
          /tmp/atellagent-client-wheel-test/bin/atellagent-hook-adapter --help >/dev/null
          /tmp/atellagent-client-wheel-test/bin/atellagent-agent-proxy --help >/dev/null
          /tmp/atellagent-client-wheel-test/bin/atellagent-tool-proxy --help >/dev/null

      - name: Verify the standard client install has no MCP SDK dependency
        run: |
          python -m venv /tmp/atellagent-client-standard-test
          wheel_path=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          /tmp/atellagent-client-standard-test/bin/pip install --constraint "$GITHUB_WORKSPACE/requirements/constraints-py311.lock" "$wheel_path"
          cd /tmp
          ! /tmp/atellagent-client-standard-test/bin/python -c 'import mcp'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docker-smoke:
    needs: public-release-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-release-artifacts
          path: dist
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the artifact-first image without registry access
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name 'atellagent_client-*.whl' -print -quit)
          test "$(sha256sum "$wheel" | awk '{print $1}')" = '${{ needs.public-release-boundary.outputs.wheel_sha256 }}'
          cp "$wheel" dist/atellagent-client.whl
          docker buildx build --load --platform linux/amd64 --file docker/Dockerfile --tag atellagent-client:inspect \
            --build-arg CLIENT_VERSION='${{ needs.public-release-boundary.outputs.client_version }}' \
            --build-arg VCS_REF='${{ github.sha }}' \
            --build-arg BUILD_DATE='${{ needs.public-release-boundary.outputs.build_date }}' \
            --build-arg CLIENT_WHEEL_SHA256='${{ needs.public-release-boundary.outputs.wheel_sha256 }}' .

      - name: Inspect runtime contents and hardened execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' atellagent-client:inspect)" = "null"
          test "$(docker image inspect --format '{{.Config.User}}' atellagent-client:inspect)" = "10001:10001"
          test "$(docker image inspect --format '{{ index .Config.Labels \"io.atellagent.client-wheel-sha256\" }}' atellagent-client:inspect)" = '${{ needs.public-release-boundary.outputs.wheel_sha256 }}'
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user 10001:10001 --entrypoint /bin/sh atellagent-client:inspect -ec '
            test ! -e /src
            test ! -e /tests
            test ! -d /root/.cache
            test -f /licenses/LICENSE.md
            test -f /licenses/THIRD_PARTY_NOTICES.md
            test "$(id -u)" = 10001
            atellagent-cli --help >/dev/null
          '

  container-platform-scan:
    needs: public-release-boundary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-release-artifacts
          path: dist
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build one platform image for content scanning
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name 'atellagent_client-*.whl' -print -quit)
          cp "$wheel" dist/atellagent-client.whl
          docker buildx build --load --platform '${{ matrix.platform }}' --file docker/Dockerfile --tag atellagent-client:scan \
            --build-arg CLIENT_VERSION='${{ needs.public-release-boundary.outputs.client_version }}' \
            --build-arg VCS_REF='${{ github.sha }}' \
            --build-arg BUILD_DATE='${{ needs.public-release-boundary.outputs.build_date }}' \
            --build-arg CLIENT_WHEEL_SHA256='${{ needs.public-release-boundary.outputs.wheel_sha256 }}' .
      - uses: anchore/scan-action@f6601287cdb1efc985d6b765bbf99cb4c0ac29d8 # v7.0.0
        with:
          image: atellagent-client:scan
          severity-cutoff: high
          fail-build: true

  client-release:
    needs: [public-release-boundary, docker-smoke, container-platform-scan]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: client-release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-release-artifacts
          path: dist
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Refuse an invalid or reused exact release
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.public-release-boundary.outputs.client_version }}'
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git diff --exit-code
          git diff --cached --exit-code

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Build, provenance-attest, SBOM-attest, and publish the manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atellagent-client"
          version='${{ needs.public-release-boundary.outputs.client_version }}'
          wheel=$(find dist -maxdepth 1 -name 'atellagent_client-*.whl' -print -quit)
          test "$(sha256sum "$wheel" | awk '{print $1}')" = '${{ needs.public-release-boundary.outputs.wheel_sha256 }}'
          if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
            echo "exact image version already exists: $image:$version" >&2
            exit 1
          fi
          cp "$wheel" dist/atellagent-client.whl
          major=${version%%.*}
          minor=${version%.*}
          docker buildx build --metadata-file /tmp/build-metadata.json --platform linux/amd64,linux/arm64 --push --provenance=mode=max --sbom=true --file docker/Dockerfile \
            --tag "$image:$version" --tag "$image:$minor" --tag "$image:$major" --tag "$image:latest" \
            --build-arg CLIENT_VERSION="$version" --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE='${{ needs.public-release-boundary.outputs.build_date }}' \
            --build-arg CLIENT_WHEEL_SHA256='${{ needs.public-release-boundary.outputs.wheel_sha256 }}' .
          digest=$(python -c 'import json; print(json.load(open("/tmp/build-metadata.json"))["containerimage.digest"])')
          test -n "$digest"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify release manifest and record release evidence
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.image.outputs.name }}'
          digest='${{ steps.image.outputs.digest }}'
          raw=$(docker buildx imagetools inspect --raw "$image@$digest")
          grep -q 'linux/amd64' <<<"$raw"
          grep -q 'linux/arm64' <<<"$raw"
          docker run --rm --platform linux/amd64 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user 10001:10001 "$image@$digest" --help >/dev/null
          {
            echo "## Atellagent client image release evidence"
            echo "- Image: \`$image@$digest\`"
            echo "- Client version: \`${{ needs.public-release-boundary.outputs.client_version }}\`"
            echo "- Wheel SHA-256: \`${{ needs.public-release-boundary.outputs.wheel_sha256 }}\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Platform scans: passed before publish in this workflow"
            echo "- Provenance and SPDX SBOM: attached by BuildKit; registry attestation attached above"
          } >> "$GITHUB_STEP_SUMMARY"
